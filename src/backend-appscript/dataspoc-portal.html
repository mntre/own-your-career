<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Own Your Career — Data SPOC Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #038F8D;
      --color-black: #000000;
      --color-white: #FFFFFF;
      --color-teal-dark: #024645;
      --color-teal-mid: #027574;
      --color-teal-soft: #9AC0C3;
      --font-heading: 'Funnel Display', sans-serif;
      --font-body: 'Funnel Sans', 'DM Sans', sans-serif;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --radius-md: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-body); color: var(--color-black); background-color: #f5f5f5; line-height: 1.6; }

    h1, h2, h3 { font-family: var(--font-heading); font-weight: 700; line-height: 1.2; }
    h1 { font-size: 2rem; } h2 { font-size: 1.5rem; }

    .portal-header {
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-teal-dark) 100%);
      color: var(--color-white);
      padding: var(--spacing-xl);
    }
    .portal-header h1 { color: var(--color-white); margin: 0; }
    .portal-main { max-width: 1200px; margin: 0 auto; padding: var(--spacing-xl); }

    .card { background: white; border: 1px solid var(--color-teal-soft); border-radius: var(--radius-md); padding: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
    .card h2, .card h3 { margin-bottom: var(--spacing-md); color: var(--color-teal-dark); }

    .form-group { margin-bottom: var(--spacing-lg); }
    .form-group label { display: block; font-weight: 500; margin-bottom: 0.25rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: var(--spacing-md);
      font-family: var(--font-body);
      font-size: 1rem;
      border: 1px solid var(--color-teal-soft);
      border-radius: var(--radius-md);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(3, 143, 141, 0.15);
    }

    .form-actions { display: flex; gap: var(--spacing-md); margin-top: var(--spacing-xl); justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: var(--spacing-md) var(--spacing-lg);
      font-family: var(--font-body);
      font-weight: 500;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .btn--primary { background-color: var(--color-primary); color: white; }
    .btn--primary:hover { background-color: var(--color-teal-mid); }
    .btn--secondary { background-color: var(--color-teal-soft); color: var(--color-teal-dark); }

    .info { background: #e8f4fd; border-left: 4px solid var(--color-primary); padding: var(--spacing-md); margin: var(--spacing-lg) 0; border-radius: 4px; }
    .form-guidance { color: #666; font-size: 0.95rem; margin-bottom: var(--spacing-md); }
  </style>
</head>
<body>
  <header class="portal-header">
    <h1>Own Your Career — Data SPOC Portal</h1>
  </header>

  <main class="portal-main">
    <section class="card">
      <h2>Step 2: OKR Uploading</h2>
      <p class="form-guidance">Upload organizational OKR data for performance calculations</p>

      <div class="info">
        <strong>ℹ️ Portal Status:</strong> Data SPOC Portal is ready. OKR uploading interface coming soon.
      </div>

      <h3>Your Organizational Data</h3>
      <form id="okr-form">
        <div class="form-group">
          <label for="corporate">Corporate</label>
          <select id="corporate" name="corporate" required>
            <option value="">-- Select Corporate --</option>
            <option value="converge-ict">Converge ICT Solutions</option>
          </select>
        </div>

        <div class="form-group">
          <label for="group">Group</label>
          <select id="group" name="group" required>
            <option value="">-- Select Group --</option>
            <option value="people-culture">People and Culture</option>
            <option value="corporate-services">Corporate Services</option>
          </select>
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" name="department" required>
            <option value="">-- Select Department --</option>
            <option value="people-platforms">People Platforms & Analytics</option>
            <option value="recruitment">Recruitment</option>
          </select>
        </div>

        <div class="form-group">
          <label for="okr-target">OKR Target Score</label>
          <input type="number" id="okr-target" name="okrTarget" placeholder="0-100" min="0" max="100" step="0.1" required />
        </div>

        <div class="form-group">
          <label for="okr-actual">OKR Actual Score</label>
          <input type="number" id="okr-actual" name="okrActual" placeholder="0-150" min="0" max="150" step="0.1" required />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Submit OKR Data</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    // === PLATFORM DETECTION (AppScript) ===
    window.PLATFORM = 'APPSCRIPT';
    window.oyc_userEmail = '<?= userEmail ?>';
    window.oyc_userEmployeeID = <?= employeeId ?>;

    console.log('[DataSPOCPortal] Platform:', window.PLATFORM);
    console.log('[DataSPOCPortal] User Email:', window.oyc_userEmail);
    console.log('[DataSPOCPortal] User ID:', window.oyc_userEmployeeID);

    const form = document.getElementById('okr-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const data = {
          corporate: formData.get('corporate'),
          group: formData.get('group'),
          department: formData.get('department'),
          okrTarget: parseFloat(formData.get('okrTarget')),
          okrActual: parseFloat(formData.get('okrActual'))
        };

        console.log('[DataSPOCPortal] Submitting OKR data:', data);

        google.script.run
          .withSuccessHandler((result) => {
            if (result.success) {
              alert('OKR data submitted successfully!');
              form.reset();
            } else {
              alert('Error: ' + result.message);
            }
          })
          .withFailureHandler((error) => {
            console.error('[DataSPOCPortal] Error:', error);
            alert('Error submitting form');
          })
          .saveOKRUpload(window.oyc_userEmployeeID, data);
      });
    }
  </script>
</body>
</html>
